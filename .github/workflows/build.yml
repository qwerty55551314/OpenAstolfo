name: Java CI with Gradle

# 同时监听 main 和 master 分支的 push 和 pull_request 事件
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取仓库代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 配置 JDK 环境（该项目通常需要 Java 8 或 Java 17，这里推荐兼容性较好的 17，可根据需要调整）
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # 3. 赋予 Gradle 脚本执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. 执行在线构建
    - name: Build with Gradle
      run: ./gradlew build -x test

    # 5. 整合路径并准备构建产物（将创建文件夹和复制操作合为一个路径命令）
    - name: Prepare Artifacts
      run: |
        mkdir -p build/ready-to-download/ && cp build/libs/*.jar build/ready-to-download/

    # 6. 上传构建产物，以便直接下载
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenAstolfo-Build-Output
        path: build/ready-to-download/
        if-no-files-found: error